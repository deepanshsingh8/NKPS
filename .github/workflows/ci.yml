name: CI

on:
  push:
    branches: [main, separate-cms-erp, phase-3-monorepo]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # A sidebar screen with no entry in the in-app guide registry ships help
      # text that silently describes a different page. Cheap to check, easy to
      # forget by hand.
      - name: Guide coverage
        run: pnpm run check:guide

      # A browser call to a token-gated route that forgets the token answers
      # 401 for every role, admins included, and the UI reports it as a
      # permission problem. That killed every fee write path silently.
      - name: API auth wiring
        run: pnpm run check:api-auth

      # Two fields landing on top of each other on a phone is not something
      # lint or tsc can see, and there is no browser in CI to catch it.
      - name: Mobile layout rules
        run: pnpm run check:mobile

      - name: Build all apps
        run: pnpm run build
        env:
          # Stub values so Next.js's static-render-time imports don't crash.
          # Real Supabase calls happen at request time, not build time.
          NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key-for-build-only
          SUPABASE_SERVICE_ROLE_KEY: stub-service-role-key-for-build-only
